<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Replenishment Console — HO Pamphlet Stock Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --navy-950:#0d141b;
  --navy-900:#121b24;
  --navy-800:#1a2530;
  --navy-700:#24323f;
  --slate-100:#eef1f4;
  --slate-200:#e2e7ec;
  --slate-50:#f7f8fa;
  --ink:#182028;
  --ink-soft:#5c6b78;
  --line:#d8dee4;
  --amber:#e8912b;
  --amber-soft:#fdeed9;
  --red:#d24d3e;
  --red-soft:#fbe2de;
  --teal:#2c9c7c;
  --teal-soft:#d9f0e7;
  --violet:#6c63c9;
  --violet-soft:#e6e3f7;
  --blue:#3d72c9;
  --blue-soft:#dfe9f9;
  --radius:10px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--slate-100);
  color:var(--ink);
  font-size:13.5px;
  line-height:1.45;
}
::selection{background:var(--amber-soft);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
.mono{font-family:var(--font-mono);}

/* ===== Top bar ===== */
.topbar{
  background:linear-gradient(180deg,var(--navy-900),var(--navy-950));
  color:#fff;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:18px;
  border-bottom:3px solid var(--amber);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:var(--amber);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:var(--navy-950);font-size:15px;
  flex:none;
}
.brand-text h1{
  font-family:var(--font-display);font-size:16.5px;font-weight:700;margin:0;letter-spacing:.2px;
}
.brand-text p{margin:1px 0 0;font-size:11px;color:#9fb0bd;}
.topbar-spacer{flex:1;}
.snapshot-pill{
  font-size:11px;color:#c7d2da;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);padding:6px 12px;border-radius:20px;
  display:flex;gap:7px;align-items:center;
}
.snapshot-pill b{color:#fff;font-weight:600;}
.global-search{
  position:relative;
}
.global-search input{
  width:280px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#fff;padding:8px 12px 8px 32px;border-radius:8px;font-size:12.5px;outline:none;
  transition:.15s;
}
.global-search input::placeholder{color:#8ea0ad;}
.global-search input:focus{background:rgba(255,255,255,.14);border-color:var(--amber);}
.global-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6;}

/* ===== Tabs ===== */
.tabbar{
  display:flex;gap:2px;background:var(--navy-950);padding:0 22px;
  border-bottom:1px solid var(--navy-800);position:sticky;top:63px;z-index:39;
}
.tab-btn{
  background:transparent;border:none;color:#9fb0bd;padding:11px 16px;font-size:12.5px;
  font-weight:600;font-family:var(--font-body);border-bottom:3px solid transparent;
  display:flex;align-items:center;gap:7px;
}
.tab-btn:hover{color:#fff;}
.tab-btn.active{color:#fff;border-bottom-color:var(--amber);}
.tab-badge{
  background:rgba(255,255,255,.12);border-radius:10px;padding:1px 7px;font-size:10.5px;font-family:var(--font-mono);
}
.tab-btn.active .tab-badge{background:var(--amber);color:var(--navy-950);}

/* ===== Layout ===== */
.layout{display:flex;align-items:flex-start;}
.filter-rail{
  width:262px;flex:none;background:#fff;border-right:1px solid var(--line);
  min-height:calc(100vh - 108px);padding:16px 14px 40px;position:sticky;top:108px;
  align-self:flex-start;max-height:calc(100vh - 108px);overflow-y:auto;
}
.main-col{flex:1;min-width:0;padding:18px 22px 50px;}

.rail-title{
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;
}
.rail-section{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--slate-200);}
.rail-section:last-child{border-bottom:none;}
.field-label{font-size:11px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;display:block;}

.reset-link{background:none;border:none;color:var(--blue);font-size:11px;font-weight:600;padding:0;}
.reset-link:hover{text-decoration:underline;}

/* segmented control */
.segmented{display:flex;background:var(--slate-100);border-radius:8px;padding:3px;gap:2px;}
.segmented button{
  flex:1;border:none;background:transparent;padding:6px 4px;font-size:11px;border-radius:6px;
  color:var(--ink-soft);font-weight:600;
}
.segmented button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);}

/* multiselect */
.ms{position:relative;}
.ms-btn{
  width:100%;text-align:left;background:var(--slate-50);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:12px;display:flex;justify-content:space-between;align-items:center;color:var(--ink);
}
.ms-btn:hover{border-color:#b9c2ca;}
.ms-count{background:var(--amber-soft);color:#8a5514;border-radius:10px;padding:1px 7px;font-size:10.5px;font-weight:700;font-family:var(--font-mono);}
.ms-panel{
  display:none;position:absolute;top:calc(100% + 5px);left:0;width:280px;max-width:80vw;
  background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(15,25,35,.18);
  z-index:50;padding:9px;
}
.ms-panel.open{display:block;}
.ms-search{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;margin-bottom:7px;outline:none;}
.ms-search:focus{border-color:var(--blue);}
.ms-actions{display:flex;justify-content:space-between;margin-bottom:6px;}
.ms-actions button{background:none;border:none;color:var(--blue);font-size:10.5px;font-weight:600;}
.ms-list{max-height:220px;overflow-y:auto;}
.ms-item{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:5px;font-size:12px;cursor:pointer;}
.ms-item:hover{background:var(--slate-100);}
.ms-item input{accent-color:var(--blue);}
.ms-item .ms-item-sub{color:var(--ink-soft);font-size:10.5px;margin-left:auto;font-family:var(--font-mono);}

/* status chips */
.chiprow{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600;
  display:flex;align-items:center;gap:6px;color:var(--ink-soft);
}
.chip .dot{width:7px;height:7px;border-radius:50%;}
.chip.active{border-color:transparent;color:#fff;}
.chip[data-status="stockout"] .dot{background:var(--red);}
.chip[data-status="low"] .dot{background:var(--amber);}
.chip[data-status="healthy"] .dot{background:var(--teal);}
.chip[data-status="overstock"] .dot{background:var(--violet);}
.chip.active[data-status="stockout"]{background:var(--red);}
.chip.active[data-status="low"]{background:var(--amber);}
.chip.active[data-status="healthy"]{background:var(--teal);}
.chip.active[data-status="overstock"]{background:var(--violet);}

/* number input row */
.num-row{display:flex;align-items:center;gap:8px;}
.num-row input[type=number]{
  width:64px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;font-family:var(--font-mono);
}
.unit-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
.unit-toggle button{border:none;background:#fff;padding:6px 10px;font-size:11px;font-weight:600;color:var(--ink-soft);}
.unit-toggle button.active{background:var(--navy-900);color:#fff;}

/* KPI cards */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
.kpi-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  position:relative;overflow:hidden;
}
.kpi-card .kpi-accent{position:absolute;left:0;top:0;bottom:0;width:4px;}
.kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;margin:0 0 6px;}
.kpi-value{font-family:var(--font-display);font-size:25px;font-weight:700;margin:0;line-height:1;}
.kpi-sub{font-size:11px;color:var(--ink-soft);margin-top:5px;}

/* section card */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--slate-200);}
.card-head h2{font-family:var(--font-display);font-size:14px;margin:0;font-weight:700;}
.card-head p{margin:2px 0 0;font-size:11px;color:var(--ink-soft);}
.card-tools{display:flex;gap:8px;align-items:center;}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;font-size:11.5px;font-weight:600;
  color:var(--ink);display:flex;align-items:center;gap:6px;
}
.btn:hover{border-color:#b9c2ca;background:var(--slate-50);}
.btn.primary{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}
.btn.primary:hover{background:var(--navy-800);}
.btn.small{padding:5px 9px;font-size:10.5px;}

/* table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.3px;}
thead th{
  position:sticky;top:0;background:var(--slate-50);text-align:left;padding:9px 12px;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border-bottom:1px solid var(--line);
  white-space:nowrap;cursor:pointer;user-select:none;font-weight:700;
}
thead th:hover{color:var(--ink);}
thead th.num,td.num{text-align:right;}
thead th .sort-arrow{opacity:.35;margin-left:3px;font-size:9px;}
thead th.sorted .sort-arrow{opacity:1;color:var(--amber);}
tbody td{padding:9px 12px;border-bottom:1px solid var(--slate-200);vertical-align:middle;}
tbody tr:hover{background:var(--slate-50);}
tbody tr.expand-row{background:var(--slate-50);}
tbody tr.expand-row:hover{background:var(--slate-50);}
.code-cell{font-family:var(--font-mono);font-weight:600;}
.desc-cell{max-width:230px;}
.desc-cell .d-main{font-weight:500;}
.desc-cell .d-sub{color:var(--ink-soft);font-size:10.8px;}
.chevron{background:none;border:none;padding:2px;color:var(--ink-soft);transition:.15s;}
.chevron.open{transform:rotate(90deg);color:var(--ink);}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;
  white-space:nowrap;
}
.badge[data-status="stockout"]{background:var(--red-soft);color:#96271a;}
.badge[data-status="low"]{background:var(--amber-soft);color:#8a5514;}
.badge[data-status="healthy"]{background:var(--teal-soft);color:#1a6b52;}
.badge[data-status="overstock"]{background:var(--violet-soft);color:#453d9c;}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.gauge-cell{display:flex;align-items:center;gap:8px;min-width:130px;}
.gauge-track{width:64px;height:6px;background:var(--slate-200);border-radius:4px;overflow:hidden;flex:none;}
.gauge-fill{height:100%;border-radius:4px;}
.gauge-val{font-family:var(--font-mono);font-size:11.5px;font-weight:600;white-space:nowrap;}

.po-flag{font-size:10px;color:var(--ink-soft);}
.po-flag.has{color:var(--blue);font-weight:600;}

.empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
.empty-state svg{opacity:.35;margin-bottom:10px;}

.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--slate-200);font-size:11.5px;color:var(--ink-soft);}
.pagination .pg-btns{display:flex;gap:5px;align-items:center;}
.pg-btn{border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:26px;font-size:11px;color:var(--ink);}
.pg-btn:disabled{opacity:.35;cursor:default;}
.pg-btn.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

/* branch expand mini table */
.mini-table{width:100%;border-collapse:collapse;font-size:11.6px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.mini-table th{background:var(--slate-100);padding:6px 10px;font-size:10px;text-transform:uppercase;color:var(--ink-soft);text-align:left;}
.mini-table td{padding:6px 10px;border-top:1px solid var(--slate-200);}
.mini-table tr.this-store{background:var(--blue-soft);}
.expand-wrap{padding:10px 14px 14px 40px;}
.expand-title{font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em;}

/* store selector card */
.store-select-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;background:linear-gradient(135deg,var(--navy-900),var(--navy-700));border-radius:var(--radius);margin-bottom:16px;color:#fff;}
.store-select-row label{font-size:11px;color:#a9b8c4;font-weight:600;display:block;margin-bottom:5px;}
.store-select-row select{
  background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;
  padding:9px 12px;font-size:13px;font-weight:600;min-width:220px;
}
.store-select-row select option{color:#111;}
.store-kpi-mini{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap;}
.store-kpi-mini div{text-align:right;}
.store-kpi-mini .v{font-family:var(--font-display);font-size:19px;font-weight:700;}
.store-kpi-mini .l{font-size:10px;color:#a9b8c4;text-transform:uppercase;letter-spacing:.05em;}

.action-btn{background:var(--blue-soft);color:#254b85;border:1px solid transparent;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;}
.action-btn:hover{background:#cfe0f7;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(13,20,27,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;width:640px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,.35);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--slate-200);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#fff;z-index:2;}
.modal-head h3{margin:0 0 3px;font-family:var(--font-display);font-size:16px;}
.modal-head p{margin:0;font-size:11.5px;color:var(--ink-soft);}
.modal-close{background:var(--slate-100);border:none;border-radius:50%;width:28px;height:28px;font-size:14px;color:var(--ink-soft);flex:none;}
.modal-body{padding:18px 22px;}
.need-banner{
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:10px;margin-bottom:16px;
}
.need-banner.covered{background:var(--teal-soft);color:#1a6b52;}
.need-banner.short{background:var(--amber-soft);color:#8a5514;}
.need-banner.none{background:var(--red-soft);color:#96271a;}
.need-banner .n-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.need-banner .n-val{font-family:var(--font-display);font-size:22px;font-weight:700;}
.sub-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:18px 0 8px;display:flex;align-items:center;gap:6px;}
.dc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px;}
.dc-box{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:var(--slate-50);}
.dc-box.total{background:var(--blue-soft);border-color:transparent;}
.dc-box .dv{font-family:var(--font-mono);font-weight:700;font-size:16px;}
.dc-box .dl{font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;margin-top:2px;}
.recommend-box{margin-top:16px;padding:13px 15px;border-radius:10px;background:var(--navy-900);color:#fff;font-size:12.5px;line-height:1.6;}
.recommend-box b{color:var(--amber);}

.footer-note{font-size:10.8px;color:var(--ink-soft);padding:14px 4px 30px;line-height:1.7;}
.footer-note code{background:var(--slate-200);padding:1px 5px;border-radius:4px;font-family:var(--font-mono);}

.charts-grid{display:grid;grid-template-columns:1.1fr 1.4fr;gap:14px;}
@media (max-width:1400px){.kpi-row{grid-template-columns:repeat(3,1fr);}}
@media (max-width:1100px){.charts-grid{grid-template-columns:1fr;}}
</style>
</head>
